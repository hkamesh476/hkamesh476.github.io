<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-label="A papaya Carnival Cash ticket with a QR code being scanned">
  <style>
    .ticket { transform-box: view-box; transform-origin: 250px 250px; animation: float 6s ease-in-out infinite; }
    .scan { animation: scan 2.4s cubic-bezier(.6,0,.4,1) infinite; }
    .glow { animation: glow 2.4s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: rotate(-6deg) translateY(6px); } 50% { transform: rotate(-3deg) translateY(-8px); } }
    @keyframes scan { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: 1; } 80% { transform: translateY(151px); opacity: 1; } 100% { transform: translateY(151px); opacity: 0; } }
    @keyframes glow { 0%, 70% { opacity: 0; } 80% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ticket, .scan, .glow { animation: none; } .scan { opacity: 0; } }
  </style>
  <rect width="500" height="500" fill="#1d1f22"/>
